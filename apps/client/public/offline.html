<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>You are offline · Hexpertify</title>
<!--
  Shown by the service worker (sw.js) when a page cannot load because there is no connection.
  Same look as the website's 404 (components/NotFound/NotFoundScene.tsx): the pendulum cradle in the brand purple.
  Everything is inline so it works offline; the logo is cached by the service worker. The font loads only when
  the browser already has it (otherwise the system font is used).
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  :root { --font: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font); color: #0f172a; -webkit-font-smoothing: antialiased;
    background: radial-gradient(ellipse at 70% 45%, #efe9ff 0%, #f8f6ff 45%, #ffffff 100%);
  }
  .page { position: relative; isolation: isolate; display: flex; flex-direction: column; min-height: 100vh; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; touch-action: none; }
  header { position: relative; z-index: 20; padding: 20px 20px 0; }
  header img { display: block; height: 40px; width: auto; mix-blend-mode: multiply; }
  section { position: relative; z-index: 10; flex: 1; display: flex; align-items: flex-end; width: 100%; max-width: 1400px; margin: 0 auto; padding: 0 20px; pointer-events: none; }
  .copy { pointer-events: auto; display: flex; flex-direction: column; gap: 24px; width: 100%; padding-bottom: 8vh; }
  .eyebrow { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: #450bc8; }
  h1 { margin: 0; font-size: 36px; line-height: 1.1; font-weight: 800; letter-spacing: -0.025em; color: #0f172a; text-wrap: balance; }
  .lead { margin: 0; max-width: 28rem; font-size: 18px; font-weight: 500; line-height: 1.625; color: #64748b; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding-top: 8px; }
  .btn {
    position: relative; isolation: isolate; display: inline-flex; align-items: center; border: 0; background: none; cursor: pointer;
    padding: 12px 24px; border-radius: 999px; font: 600 14px/1.4 var(--font); letter-spacing: 0.05em; text-transform: uppercase; color: #fff;
    transition: padding 450ms cubic-bezier(0.625, 0.05, 0, 1);
  }
  .btn::before {
    content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 999px; background: #450bc8;
    transition: inset 450ms cubic-bezier(0.625, 0.05, 0, 1), background-color 450ms cubic-bezier(0.625, 0.05, 0, 1);
  }
  .btn:hover { padding-right: 44px; }
  .btn:hover::before { inset: -4px; background: #5e2be2; }
  .btn:active::before { inset: 0; }
  .btn:focus-visible { outline: 2px solid #450bc8; outline-offset: 4px; }
  .btn svg { position: absolute; right: 16px; width: 16px; height: 16px; opacity: 0; transform: translateX(-8px) rotate(0deg);
    transition: all 450ms cubic-bezier(0.625, 0.05, 0, 1); }
  .btn:hover svg { opacity: 1; transform: translateX(0) rotate(0deg); }
  .btn.busy svg { opacity: 1; animation: spin 900ms linear infinite; }
  .status { font-size: 13px; font-weight: 600; color: #450bc8; display: inline-flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #f43f5e; box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.5); animation: pulse 1.8s infinite; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  .word { display: inline-block; white-space: nowrap; }
  .letter { display: inline-block; opacity: 0; transform: translateY(0.35em); filter: blur(6px); animation: in 700ms cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  .fade { opacity: 0; animation: in 900ms cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  @keyframes in { to { opacity: 1; transform: none; filter: none; } }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(244, 63, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); } }
  @media (min-width: 768px) { header img { height: 48px; } }
  @media (min-width: 1024px) {
    header { padding: 28px 40px 0; }
    section { align-items: center; padding: 0 40px; }
    .copy { max-width: 46%; padding-bottom: 0; }
    h1 { font-size: 60px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .letter, .fade { animation: none; opacity: 1; transform: none; filter: none; }
    .dot, .btn.busy svg { animation: none; }
  }
</style>
</head>
<body>
<div class="page">
  <canvas id="cradle" aria-hidden="true"></canvas>

  <header>
    <a href="/" aria-label="Go to Hexpertify home page"><img src="/expertify-logo.png" alt="Hexpertify" onerror="this.remove()"></a>
  </header>

  <section>
    <div class="copy">
      <p class="eyebrow" data-reveal="No connection · You are offline" data-step="12"></p>
      <h1 data-reveal="Oops! You're offline." data-start="250" data-step="22"></h1>
      <p class="lead fade" style="animation-delay:900ms">
        Check your internet connection. This page opens again as soon as you are back online.
      </p>
      <div class="actions fade" style="animation-delay:1100ms">
        <button type="button" class="btn" id="retry">
          Try again
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
          </svg>
        </button>
        <span class="status" role="status" id="status"><span class="dot" aria-hidden="true"></span><span id="status-text">Waiting for connection…</span></span>
      </div>
    </div>
  </section>
</div>

<script>
(function () {
  var FONT = "'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif";

  // Letter-by-letter reveal (screen readers get the plain text)
  document.querySelectorAll('[data-reveal]').forEach(function (el) {
    var text = el.getAttribute('data-reveal');
    var start = Number(el.getAttribute('data-start') || 0);
    var step = Number(el.getAttribute('data-step') || 16);
    var sr = document.createElement('span');
    sr.className = 'sr-only';
    sr.textContent = text;
    var shown = document.createElement('span');
    shown.setAttribute('aria-hidden', 'true');
    var index = 0;
    var words = text.split(' ');
    words.forEach(function (word, w) {
      var wordEl = document.createElement('span');
      wordEl.className = 'word';
      word.split('').forEach(function (ch) {
        var l = document.createElement('span');
        l.className = 'letter';
        l.style.animationDelay = (start + index++ * step) + 'ms';
        l.textContent = ch;
        wordEl.appendChild(l);
      });
      if (w < words.length - 1) {
        var gap = document.createElement('span');
        gap.className = 'word';
        gap.innerHTML = '&nbsp;';
        wordEl.appendChild(gap);
      }
      shown.appendChild(wordEl);
    });
    el.appendChild(sr);
    el.appendChild(shown);
  });

  // Reload when the connection is back, or when the visitor asks
  var retry = document.getElementById('retry');
  var statusText = document.getElementById('status-text');
  function reload() { location.reload(); }
  retry.addEventListener('click', function () {
    retry.classList.add('busy');
    statusText.textContent = 'Trying to reconnect…';
    if (navigator.onLine) reload();
    else setTimeout(function () { retry.classList.remove('busy'); statusText.textContent = 'Still offline. Waiting for connection…'; }, 1200);
  });
  window.addEventListener('online', function () { statusText.textContent = 'Back online. Opening…'; setTimeout(reload, 400); });

  // The pendulum cradle (same physics as the 404 page). Drag a ball out and let go.
  var canvas = document.getElementById('cradle');
  var ctx = canvas.getContext && canvas.getContext('2d');
  if (!ctx) return;

  var BALLS = 5, LABELS = ['', 'O', 'F', 'F', ''], STIFFNESS = 15, MAX_ANGLE = 1.15, SUBSTEPS = 10;
  var ease = function (x) { return 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, x))); };
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var theta = [0, 0, 0, 0, 0], omega = [0, 0, 0, 0, 0];
  var w = 0, h = 0, last = performance.now();
  var drag = null, hover = -1, touched = false, stillSince = last, autoSide = -1;
  var lift = reduceMotion ? null : { index: 0, start: last + 1200, to: -0.75 };

  function geometry() {
    var desktop = w >= 1024;
    var r = desktop ? Math.min(w * 0.024, h * 0.045, 34) : Math.min(w * 0.065, 26);
    var cx = desktop ? w * 0.72 : w / 2;
    var top = desktop ? h * 0.2 : Math.max(96, h * 0.12);
    var length = desktop ? Math.min(h * 0.4, 300) : Math.min(h * 0.24, 200);
    var anchors = [];
    for (var i = 0; i < BALLS; i++) anchors.push(cx + (i - (BALLS - 1) / 2) * 2 * r);
    return { r: r, cx: cx, top: top, length: length, anchors: anchors };
  }
  function ballAt(i, g) {
    g = g || geometry();
    return { x: g.anchors[i] + g.length * Math.sin(theta[i]), y: g.top + g.length * Math.cos(theta[i]) };
  }
  function hitBall(px, py) {
    var g = geometry();
    for (var i = 0; i < BALLS; i++) {
      var b = ballAt(i, g);
      if (Math.hypot(px - b.x, py - b.y) <= g.r * 1.25) return i;
    }
    return -1;
  }
  function groupOf(index, angle) {
    var out = [];
    if (angle < 0) for (var i = 0; i <= index; i++) out.push(i);
    else for (var j = index; j < BALLS; j++) out.push(j);
    return out;
  }
  function holdGroup(index, angle) {
    var group = groupOf(index, angle);
    for (var i = 0; i < BALLS; i++) { theta[i] = group.indexOf(i) >= 0 ? angle : 0; omega[i] = 0; }
  }
  function step(dt) {
    var g = geometry(), h1 = dt / SUBSTEPS;
    for (var s = 0; s < SUBSTEPS; s++) {
      for (var i = 0; i < BALLS; i++) {
        omega[i] += -STIFFNESS * Math.sin(theta[i]) * h1;
        omega[i] *= 1 - 0.06 * h1;
        theta[i] += omega[i] * h1;
      }
      for (var pass = 0; pass < 4; pass++) {
        for (var k = 0; k < BALLS - 1; k++) {
          var a = g.anchors[k] + g.length * Math.sin(theta[k]);
          var b = g.anchors[k + 1] + g.length * Math.sin(theta[k + 1]);
          var overlap = 2 * g.r - (b - a);
          if (overlap > 0.01) {
            var c = overlap / 2 / g.length;
            theta[k] -= c; theta[k + 1] += c;
            if (omega[k] > omega[k + 1]) { var t = omega[k]; omega[k] = omega[k + 1] * 0.997; omega[k + 1] = t * 0.997; }
          }
        }
      }
    }
  }
  function roundRect(x, y, rw, rh, rr) {
    if (ctx.roundRect) { ctx.roundRect(x, y, rw, rh, rr); return; }
    ctx.moveTo(x + rr, y); ctx.arcTo(x + rw, y, x + rw, y + rh, rr); ctx.arcTo(x + rw, y + rh, x, y + rh, rr);
    ctx.arcTo(x, y + rh, x, y, rr); ctx.arcTo(x, y, x + rw, y, rr); ctx.closePath();
  }
  function draw() {
    var g = geometry(), i, b;
    ctx.clearRect(0, 0, w, h);

    var glow = ctx.createRadialGradient(g.cx, g.top + g.length * 0.75, g.r, g.cx, g.top + g.length * 0.75, g.length * 1.3);
    glow.addColorStop(0, 'rgba(94, 43, 226, 0.16)');
    glow.addColorStop(1, 'rgba(94, 43, 226, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, w, h);

    var floor = g.top + g.length + g.r * 2.6;
    for (i = 0; i < BALLS; i++) {
      b = ballAt(i, g);
      var spread = 1 + Math.abs((b.y - (g.top + g.length)) / g.length) * 1.8;
      ctx.beginPath();
      ctx.ellipse(b.x, floor, g.r * 0.95 * spread, g.r * 0.22 * spread, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(42, 8, 122, ' + (0.14 / spread) + ')';
      ctx.fill();
    }

    var barW = (BALLS - 1) * 2 * g.r + g.r * 5, barH = Math.max(8, g.r * 0.42);
    var bar = ctx.createLinearGradient(0, g.top - barH, 0, g.top);
    bar.addColorStop(0, '#5e2be2');
    bar.addColorStop(1, '#2a0a7a');
    ctx.beginPath();
    roundRect(g.cx - barW / 2, g.top - barH, barW, barH, barH / 2);
    ctx.fillStyle = bar;
    ctx.shadowColor = 'rgba(42, 8, 122, 0.25)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 6;
    ctx.fill();
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

    for (i = 0; i < BALLS; i++) {
      b = ballAt(i, g);
      ctx.beginPath(); ctx.moveTo(g.anchors[i], g.top); ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = 'rgba(69, 11, 200, 0.45)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.beginPath(); ctx.arc(g.anchors[i], g.top, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = '#2a0a7a'; ctx.fill();
    }
    for (i = 0; i < BALLS; i++) {
      b = ballAt(i, g);
      var active = (drag && drag.index === i) || hover === i;
      var fill = ctx.createRadialGradient(b.x - g.r * 0.35, b.y - g.r * 0.4, g.r * 0.1, b.x, b.y, g.r);
      fill.addColorStop(0, active ? '#b39cff' : '#9b7bff');
      fill.addColorStop(0.55, '#5e2be2');
      fill.addColorStop(1, '#450bc8');
      ctx.beginPath(); ctx.arc(b.x, b.y, g.r, 0, Math.PI * 2);
      ctx.fillStyle = fill;
      ctx.shadowColor = 'rgba(69, 11, 200, 0.35)'; ctx.shadowBlur = active ? 26 : 18;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.ellipse(b.x - g.r * 0.32, b.y - g.r * 0.42, g.r * 0.3, g.r * 0.17, -0.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.35)'; ctx.fill();
      if (LABELS[i]) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
        ctx.font = '800 ' + Math.round(g.r * 0.8) + 'px ' + FONT;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(LABELS[i], b.x, b.y + g.r * 0.04);
      }
    }

    if (!touched) {
      ctx.fillStyle = 'rgba(69, 11, 200, 0.55)';
      ctx.font = '600 ' + (w < 640 ? 12 : 13) + 'px ' + FONT;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('Drag a ball and let go', g.cx, floor + g.r * 1.4);
    }
  }
  function tick(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (lift && now >= lift.start) {
      var t = (now - lift.start) / 650;
      holdGroup(lift.index, lift.to * ease(t));
      if (t >= 1) lift = null;
    } else if (!drag) {
      step(dt);
    }
    var energy = 0;
    for (var i = 0; i < BALLS; i++) energy += Math.abs(theta[i]) + Math.abs(omega[i]) * 0.2;
    if (energy > 0.02 || drag || lift) stillSince = now;
    else if (!touched && now - stillSince > 2500) {
      autoSide = -autoSide;
      lift = { index: autoSide < 0 ? 0 : BALLS - 1, start: now, to: autoSide * 0.75 };
    }
    draw();
    requestAnimationFrame(tick);
  }
  function local(e) {
    var rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  function setCursor(v) { document.documentElement.style.cursor = v; }

  function resize() {
    var rect = canvas.getBoundingClientRect();
    w = rect.width; h = rect.height;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (reduceMotion) draw();
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas);
  else window.addEventListener('resize', resize);
  resize();
  // Redraw the ball letters once the font is ready
  if (reduceMotion && document.fonts) document.fonts.ready.then(draw);

  if (reduceMotion) return;
  window.addEventListener('pointerdown', function (e) {
    if (e.target && e.target.closest && e.target.closest('a, button')) return;
    var p = local(e), index = hitBall(p.x, p.y);
    if (index < 0) return;
    e.preventDefault();
    touched = true; lift = null;
    drag = { index: index, prev: theta[index], vel: 0 };
    setCursor('grabbing');
  });
  window.addEventListener('pointermove', function (e) {
    var p = local(e);
    if (!drag) { hover = hitBall(p.x, p.y); setCursor(hover >= 0 ? 'grab' : ''); return; }
    var g = geometry();
    var angle = Math.max(-MAX_ANGLE, Math.min(MAX_ANGLE, Math.atan2(p.x - g.anchors[drag.index], Math.max(1, p.y - g.top))));
    drag.vel = drag.vel * 0.6 + ((angle - drag.prev) / 0.016) * 0.4;
    drag.prev = angle;
    holdGroup(drag.index, angle);
  }, { passive: true });
  function onUp() {
    if (!drag) return;
    var release = Math.max(-5, Math.min(5, drag.vel));
    groupOf(drag.index, theta[drag.index]).forEach(function (i) { omega[i] = release; });
    drag = null;
    setCursor(hover >= 0 ? 'grab' : '');
  }
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  window.addEventListener('touchmove', function (e) { if (drag) e.preventDefault(); }, { passive: false });
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
